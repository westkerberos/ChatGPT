name: Build OBS 33.0.3 native MJPEG recorder

on:
  push:
    branches: [obs-33.0.3-native-mjpeg]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout OBS 33.0.3
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch 33.0.3 https://github.com/obsproject/obs-studio.git obs-studio

      - name: Verify MSVC 14.44 ATL headers required by OBS DirectShow dependencies
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe was not found on this runner" }

          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio 2022 C++ x64 toolchain was not found" }

          $toolsetRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $toolset = Get-ChildItem -Path $toolsetRoot -Directory | Where-Object { $_.Name -like "14.44.*" } | Select-Object -First 1
          if (-not $toolset) { throw "MSVC 14.44 toolset was not found at $toolsetRoot" }

          $atlComponent = "Microsoft.VisualStudio.Component.VC.ATL"
          $hasAtl = & $vswhere -latest -products * -requires $atlComponent -property installationPath
          if (-not $hasAtl) { throw "The Visual Studio 2022 runner does not have the v143 ATL component installed" }

          $atlInclude = Join-Path $toolset.FullName "atlmfc\include"
          foreach ($header in @("atlcomcli.h", "atlstr.h")) {
            if (-not (Test-Path (Join-Path $atlInclude $header))) {
              throw "MSVC 14.44 ATL header is missing: $(Join-Path $atlInclude $header)"
            }
          }
          Write-Host "Matching MSVC 14.44 ATL headers verified at $atlInclude"

      - name: Apply native MJPEG patch
        shell: pwsh
        run: |
          Set-Location obs-studio
          git apply --recount --check "$env:GITHUB_WORKSPACE\obs-33.0.0-beta4-native-mjpeg.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply --recount "$env:GITHUB_WORKSPACE\obs-33.0.0-beta4-native-mjpeg.patch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Verify patch is present
        shell: pwsh
        working-directory: obs-studio
        run: |
          Write-Host "Checking patched source..."
          if (-not (Select-String -Path "plugins/win-dshow/win-dshow.cpp" -Pattern "native_mjpeg_record" -Quiet)) { throw "Patch marker missing from win-dshow.cpp" }
          if (-not (Select-String -Path "plugins/win-dshow/mjpeg-recorder.cpp" -Pattern "NativeMjpegRecorder" -Quiet)) { throw "mjpeg-recorder.cpp marker missing" }
          if (-not (Select-String -Path "plugins/win-dshow/CMakeLists.txt" -Pattern "FFmpeg::avformat" -Quiet)) { throw "FFmpeg::avformat marker missing" }
          Write-Host "Patch markers confirmed."

      - name: Configure OBS with matching VS 2022 v143 toolset
        shell: pwsh
        working-directory: obs-studio
        run: |
          $presetPath = "CMakePresets.json"
          $presetJson = [System.IO.File]::ReadAllText($presetPath)
          $oldGenerator = '"generator": "Visual Studio 18 2026"'
          $newGenerator = '"generator": "Visual Studio 17 2022"'
          if (-not $presetJson.Contains($oldGenerator)) { throw "OBS 33.0.3 Windows preset did not contain the expected VS 2026 generator" }
          $presetJson = $presetJson.Replace($oldGenerator, $newGenerator)
          [System.IO.File]::WriteAllText($presetPath, $presetJson, [System.Text.UTF8Encoding]::new($false))
          cmake --preset windows-x64

      - name: Build win-dshow
        shell: pwsh
        working-directory: obs-studio
        run: |
          cmake --build build_x64 --config RelWithDebInfo --target win-dshow -- /m

      - name: Locate DLL
        shell: pwsh
        working-directory: obs-studio
        run: |
          $dll = Get-ChildItem -Recurse -Filter "win-dshow64.dll" -File | Select-Object -First 1
          if (-not $dll) {
            $dll = Get-ChildItem -Recurse -Filter "win-dshow.dll" -File | Select-Object -First 1
          }
          if (-not $dll) {
            Write-Host "No win-dshow DLL found"
            Get-ChildItem -Recurse -Filter "*dshow*.dll" -File | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Found: $($dll.FullName)"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\artifact" | Out-Null
          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE\artifact\$($dll.Name)"

          $pdb = Get-ChildItem $dll.Directory -Filter "win-dshow*.pdb" -File | Select-Object -First 1
          if ($pdb) {
            Copy-Item $pdb.FullName "$env:GITHUB_WORKSPACE\artifact\$($pdb.Name)"
          }

          $hash = (Get-FileHash "$env:GITHUB_WORKSPACE\artifact\$($dll.Name)" -Algorithm SHA256).Hash
          Set-Content "$env:GITHUB_WORKSPACE\artifact\SHA256.txt" "$hash  $($dll.Name)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-33.0.3-native-mjpeg-win-dshow
          path: artifact/
          if-no-files-found: error
          retention-days: 14
